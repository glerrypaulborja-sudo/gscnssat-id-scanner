<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1">

  <title>GSCNSSAT ID Logging System</title>


  <!-- =====================================================
       QR SCANNER LIBRARY
       ===================================================== -->

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>


  <!-- =====================================================
       STYLE
       ===================================================== -->

  <style>

    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f3f4;
      color: #202124;
    }


    .container {
      max-width: 900px;
      margin: auto;
      padding: 30px;
    }


    h1 {
      text-align: center;
      margin-bottom: 5px;
    }


    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }


    .scanner-card {
      background: white;
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.12);
    }


    /* =====================================================
       QR READER
       ===================================================== */

    #reader {
      width: 100%;
      max-width: 650px;
      margin: auto;
    }


    /* =====================================================
       STATUS
       ===================================================== */

    .status {
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      margin: 20px 0;
    }


    .success {
      color: #188038;
    }


    .error {
      color: #d93025;
    }


    /* =====================================================
       INFORMATION
       ===================================================== */

    .info {
      text-align: center;
      font-size: 20px;
      line-height: 1.7;
      margin-top: 20px;
    }


    /* =====================================================
       FULL QR DATA
       ===================================================== */

    .qr-label {
      display: block;
      text-align: left;
      font-weight: bold;
      margin-bottom: 8px;
    }


    .qr-data {
      display: block;
      width: 100%;

      margin-top: 10px;
      padding: 15px;

      background: #f1f3f4;

      border-radius: 8px;

      text-align: left;

      font-size: 18px;
      line-height: 1.5;

      /*
       * Prevent long QR data from overflowing.
       */

      word-break: break-all;
      overflow-wrap: anywhere;
    }


    /* =====================================================
       LRN
       ===================================================== */

    .lrn-label {
      display: block;
      text-align: left;
      font-weight: bold;
      margin-bottom: 8px;
    }


    .lrn-data {
      display: block;
      width: 100%;

      margin-top: 10px;
      padding: 15px;

      background: #e8f0fe;

      border-radius: 8px;

      font-size: 26px;
      font-weight: bold;
      letter-spacing: 1px;

      text-align: center;
    }


    /* =====================================================
       BUTTON
       ===================================================== */

    .button {
      border: none;
      border-radius: 8px;

      padding: 14px 25px;

      font-size: 18px;
      font-weight: bold;

      cursor: pointer;

      margin-top: 20px;

      background: #1a73e8;
      color: white;
    }


    .button:hover {
      background: #1557b0;
    }


    /* =====================================================
       CENTER
       ===================================================== */

    .center {
      text-align: center;
    }


    /* =====================================================
       HIDDEN
       ===================================================== */

    .hidden {
      display: none !important;
    }


    /* =====================================================
       MOBILE
       ===================================================== */

    @media (max-width: 600px) {

      .container {
        padding: 15px;
      }

      .scanner-card {
        padding: 15px;
      }

      h1 {
        font-size: 24px;
      }

      .status {
        font-size: 20px;
      }

      .info {
        font-size: 18px;
      }

      .lrn-data {
        font-size: 22px;
      }

    }

  </style>

</head>


<body>


  <!-- =====================================================
       MAIN CONTAINER
       ===================================================== -->

  <div class="container">


    <!-- ===================================================
         HEADER
         =================================================== -->

    <h1>
      GSCNSSAT ID LOGGING SYSTEM
    </h1>


    <div class="subtitle">
      Learner QR Scanner
    </div>


    <!-- ===================================================
         SCANNER CARD
         =================================================== -->

    <div class="scanner-card">


      <!-- =================================================
           SCANNER SECTION
           ================================================= -->

      <div id="scannerSection">

        <div
          id="status"
          class="status">

          READY TO SCAN

        </div>


        <div id="reader"></div>

      </div>


      <!-- =================================================
           SUCCESS SECTION
           ================================================= -->

      <div
        id="successSection"
        class="hidden">


        <div class="status success">

          ✓ SCAN SUBMITTED

        </div>


        <div
          id="studentInfo"
          class="info">

        </div>


        <div class="center">

          <button
            type="button"
            class="button"
            onclick="startScanner()">

            SCAN NEXT LEARNER

          </button>

        </div>

      </div>


      <!-- =================================================
           ERROR SECTION
           ================================================= -->

      <div
        id="errorSection"
        class="hidden">


        <div class="status error">

          ✕ ERROR

        </div>


        <div
          id="errorMessage"
          class="info">

        </div>


        <div class="center">

          <button
            type="button"
            class="button"
            onclick="startScanner()">

            TRY AGAIN

          </button>

        </div>

      </div>


    </div>

  </div>


  <!-- =====================================================
       HIDDEN IFRAME

       Apps Script receives the POST here instead of
       navigating away from the scanner page.
       ===================================================== -->

  <iframe
    name="hiddenFrame"
    style="display:none;">
  </iframe>


  <!-- =====================================================
       JAVASCRIPT
       ===================================================== -->

  <script>


    /* =====================================================
       APPS SCRIPT WEB APP URL
       ===================================================== */

    const APPS_SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbzfQo-pDnjCtEdQZDn4rVVURqT0h2-4GGzrjD0uLHvnGLgDihRTe4L1QNsvN-dU9OT/exec";


    /* =====================================================
       SCANNER VARIABLES
       ===================================================== */

    let scanner = null;

    let scanning = false;


    /* =====================================================
       START SCANNER
       ===================================================== */

    async function startScanner() {


      console.log("Starting scanner...");


      /*
       * Disable scanning while initializing.
       */

      scanning = false;


      /*
       * Hide success section.
       */

      document
        .getElementById("successSection")
        .classList.add("hidden");


      /*
       * Hide error section.
       */

      document
        .getElementById("errorSection")
        .classList.add("hidden");


      /*
       * Show scanner section.
       */

      document
        .getElementById("scannerSection")
        .style.display = "block";


      /*
       * Update status.
       */

      document
        .getElementById("status")
        .innerText = "STARTING CAMERA...";


      /* =================================================
         STOP PREVIOUS SCANNER
         ================================================= */

      if (scanner !== null) {

        try {

          if (scanner.isScanning) {

            await scanner.stop();

          }

        } catch (error) {

          console.log(
            "Previous scanner stop:",
            error
          );

        }

        try {

          await scanner.clear();

        } catch (error) {

          console.log(
            "Previous scanner clear:",
            error
          );

        }

        scanner = null;

      }


      /* =================================================
         CLEAR READER ELEMENT
         ================================================= */

      document
        .getElementById("reader")
        .innerHTML = "";


      /* =================================================
         CREATE NEW SCANNER
         ================================================= */

      scanner =
        new Html5Qrcode("reader");


      /* =================================================
         SCANNER CONFIGURATION
         ================================================= */

      const config = {

        fps: 10,

        qrbox: {
          width: 300,
          height: 300
        },

        aspectRatio: 1.0

      };


      /* =================================================
         START CAMERA
         ================================================= */

      try {


        await scanner.start(

          /*
           * Front-facing laptop webcam.
           */

          {
            facingMode: "user"
          },

          config,


          /*
           * QR CODE SUCCESS CALLBACK
           */

          handleQRCode,


          /*
           * QR CODE SCAN FAILURE CALLBACK

           * This is intentionally empty because the
           * scanner generates many "not found" messages
           * while searching.
           */

          function(errorMessage) {

            // Do nothing.

          }

        );


        /*
         * Scanner successfully started.
         */

        scanning = true;


        document
          .getElementById("status")
          .innerText = "READY TO SCAN";


        console.log(
          "Scanner started successfully."
        );


      }


      catch (error) {


        console.error(
          "Camera start error:",
          error
        );


        showError(

          "Unable to start the camera.\n\n" +

          "Please check the following:\n\n" +

          "• Allow camera access in your browser.\n" +

          "• Make sure your laptop webcam is working.\n" +

          "• Make sure another application is not using the camera.\n" +

          "• Reload the page and try again."

        );

      }

    }


    /* =====================================================
       QR CODE FOUND
       ===================================================== */

    async function handleQRCode(
      decodedText
    ) {


      /*
       * Ignore additional detections after the first one.
       */

      if (!scanning) {

        return;

      }


      /*
       * Immediately disable scanning.

       This prevents the same learner from being
       submitted multiple times.
       */

      scanning = false;


      /* =================================================
         GET COMPLETE QR DATA
         ================================================= */

      const qrData =
        String(decodedText).trim();


      console.log(
        "FULL QR DATA:",
        qrData
      );


      /* =================================================
         EXTRACT LRN

         Example:

         QR DATA:
         123456789012,JUAN DELA CRUZ,01/01/2010

         LRN:
         123456789012
         ================================================= */

      const lrn =
        qrData
          .split(",")[0]
          .trim();


      console.log(
        "LRN TO SEND:",
        lrn
      );


      /* =================================================
         VALIDATE LRN
         ================================================= */

      if (!/^\d{12}$/.test(lrn)) {


        showError(

          "INVALID QR CODE\n\n" +

          "FULL QR DATA:\n" +

          qrData +

          "\n\n" +

          "EXTRACTED LRN:\n" +

          lrn

        );


        return;

      }


      /* =================================================
         STOP CAMERA
         ================================================= */

      try {

        if (
          scanner &&
          scanner.isScanning
        ) {

          await scanner.stop();

        }

      }

      catch (error) {

        console.log(
          "Scanner stop error:",
          error
        );

      }


      /* =================================================
         UPDATE STATUS
         ================================================= */

      document
        .getElementById("status")
        .innerText = "SUBMITTING...";


      /* =================================================
         SEND DATA
         ================================================= */

      sendScan(
        lrn,
        qrData
      );

    }


    /* =====================================================
       SEND SCAN TO GOOGLE APPS SCRIPT
       ===================================================== */

    function sendScan(
      lrn,
      qrData
    ) {


      console.log(
        "Sending LRN to Apps Script:",
        lrn
      );


      /* =================================================
         CREATE FORM
         ================================================= */

      const form =
        document.createElement("form");


      form.method = "POST";


      form.action =
        APPS_SCRIPT_URL;


      /*
       * Send the form to the hidden iframe.
       */

      form.target =
        "hiddenFrame";


      /* =================================================
         LRN INPUT
         ================================================= */

      const lrnInput =
        document.createElement("input");


      lrnInput.type = "hidden";


      lrnInput.name = "lrn";


      lrnInput.value = lrn;


      /* =================================================
         STATION INPUT
         ================================================= */

      const stationInput =
        document.createElement("input");


      stationInput.type = "hidden";


      stationInput.name = "station";


      stationInput.value = "MAIN";


      /* =================================================
         LOG TYPE INPUT
         ================================================= */

      const logTypeInput =
        document.createElement("input");


      logTypeInput.type = "hidden";


      logTypeInput.name = "logType";


      logTypeInput.value = "SCAN";


      /* =================================================
         ADD INPUTS TO FORM
         ================================================= */

      form.appendChild(
        lrnInput
      );


      form.appendChild(
        stationInput
      );


      form.appendChild(
        logTypeInput
      );


      /* =================================================
         SUBMIT FORM
         ================================================= */

      document.body.appendChild(
        form
      );


      form.submit();


      /*
       * Remove temporary form.
       */

      form.remove();


      console.log(
        "Form submitted."
      );


      /* =================================================
         DISPLAY SUCCESS
         ================================================= */

      showSuccess(
        qrData,
        lrn
      );

    }


    /* =====================================================
       SHOW SUCCESS
       ===================================================== */

    function showSuccess(
      qrData,
      lrn
    ) {


      /* =================================================
         HIDE SCANNER
         ================================================= */

      document
        .getElementById("scannerSection")
        .style.display = "none";


      /* =================================================
         HIDE ERROR
         ================================================= */

      document
        .getElementById("errorSection")
        .classList.add("hidden");


      /* =================================================
         SHOW SUCCESS
         ================================================= */

      document
        .getElementById("successSection")
        .classList.remove("hidden");


      /* =================================================
         DISPLAY DATA
         ================================================= */

      document
        .getElementById("studentInfo")
        .innerHTML =


          /*
           * FULL QR DATA
           */

          "<div>" +

            "<strong class=\"qr-label\">" +

              "FULL QR DATA:" +

            "</strong>" +


            "<div class=\"qr-data\">" +

              escapeHtml(qrData) +

            "</div>" +

          "</div>" +


          /*
           * LRN
           */

          "<div style=\"margin-top:25px;\">" +

            "<strong class=\"lrn-label\">" +

              "LRN SENT TO LOG:" +

            "</strong>" +


            "<div class=\"lrn-data\">" +

              escapeHtml(lrn) +

            "</div>" +

          "</div>" +


          /*
           * MESSAGE
           */

          "<div style=\"margin-top:20px;\">" +

            "The LRN has been submitted to the logging system." +

          "</div>";

    }


    /* =====================================================
       SHOW ERROR
       ===================================================== */

    async function showError(
      message
    ) {


      /*
       * Stop scanning.
       */

      scanning = false;


      /* =================================================
         STOP CAMERA
         ================================================= */

      if (scanner) {

        try {

          if (scanner.isScanning) {

            await scanner.stop();

          }

        }

        catch (error) {

          console.log(
            "Scanner stop error:",
            error
          );

        }

      }


      /* =================================================
         HIDE SCANNER
         ================================================= */

      document
        .getElementById("scannerSection")
        .style.display = "none";


      /* =================================================
         HIDE SUCCESS
         ================================================= */

      document
        .getElementById("successSection")
        .classList.add("hidden");


      /* =================================================
         SHOW ERROR
         ================================================= */

      document
        .getElementById("errorSection")
        .classList.remove("hidden");


      /* =================================================
         DISPLAY ERROR MESSAGE
         ================================================= */

      document
        .getElementById("errorMessage")
        .innerText =
          message;

    }


    /* =====================================================
       ESCAPE HTML
       ===================================================== */

    function escapeHtml(
      text
    ) {


      const div =
        document.createElement("div");


      div.textContent =
        String(text);


      return div.innerHTML;

    }


    /* =====================================================
       START SCANNER WHEN PAGE LOADS
       ===================================================== */

    window.addEventListener(
      "load",
      function() {

        startScanner();

      }
    );


  </script>


</body>

</html>
