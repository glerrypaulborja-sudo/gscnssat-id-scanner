<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1">

  <title>GSCNSSAT ID Logging System</title>

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f3f4;
      color: #202124;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 30px;
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    .scanner-card {
      background: white;
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.12);
    }

    #reader {
      width: 100%;
      max-width: 650px;
      margin: auto;
    }

    .status {
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      margin: 20px 0;
    }

    .success {
      color: #188038;
    }

    .error {
      color: #d93025;
    }

    .info {
      text-align: center;
      font-size: 20px;
      line-height: 1.7;
      margin-top: 20px;
    }

    .qr-data {
      margin-top: 10px;
      padding: 15px;
      background: #f1f3f4;
      border-radius: 8px;
      word-break: break-word;
      text-align: left;
      font-size: 18px;
      line-height: 1.5;
    }

    .lrn-data {
      margin-top: 10px;
      padding: 15px;
      background: #e8f0fe;
      border-radius: 8px;
      font-size: 26px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .button {
      border: none;
      border-radius: 8px;
      padding: 14px 25px;
      font-size: 18px;
      cursor: pointer;
      margin-top: 20px;
      background: #1a73e8;
      color: white;
    }

    .center {
      text-align: center;
    }

    .hidden {
      display: none;
    }

  </style>

</head>


<body>

<div class="container">

  <h1>GSCNSSAT ID LOGGING SYSTEM</h1>

  <div class="subtitle">
    Learner QR Scanner
  </div>


  <div class="scanner-card">


    <!-- =================================================
         SCANNER SECTION
         ================================================= -->

    <div id="scannerSection">

      <div id="status" class="status">
        READY TO SCAN
      </div>

      <div id="reader"></div>

    </div>


    <!-- =================================================
         SUCCESS SECTION
         ================================================= -->

    <div id="successSection" class="hidden">

      <div class="status success">
        ✓ SCAN SUBMITTED
      </div>


      <div id="studentInfo" class="info">
      </div>


      <div class="center">

        <button
          class="button"
          onclick="startScanner()">

          SCAN NEXT LEARNER

        </button>

      </div>

    </div>


    <!-- =================================================
         ERROR SECTION
         ================================================= -->

    <div id="errorSection" class="hidden">

      <div class="status error">
        ✕ ERROR
      </div>


      <div id="errorMessage" class="info">
      </div>


      <div class="center">

        <button
          class="button"
          onclick="startScanner()">

          TRY AGAIN

        </button>

      </div>

    </div>


  </div>

</div>


<script>


/* =====================================================
   APPS SCRIPT WEB APP URL
   ===================================================== */

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbzfQo-pDnjCtEdQZDn4rVVURqT0h2-4GGzrjJd0uLHvnGLgDihRTe4L1QNsvN-dU9OT/exec";


/* =====================================================
   SCANNER VARIABLES
   ===================================================== */

let scanner = null;

let scanning = false;


/* =====================================================
   START SCANNER
   ===================================================== */

function handleQRCode(decodedText) {

  if (!scanning) return;

  scanning = false;

  // COMPLETE QR DATA
  const qrData = String(decodedText).trim();

  console.log("FULL QR DATA:", qrData);

  // ONLY FIRST FIELD = LRN
  const lrn = qrData.split(",")[0].trim();

  console.log("LRN TO SEND:", lrn);

  // Validate LRN
  if (!/^\d{12}$/.test(lrn)) {

    showError(
      "Invalid QR code.\n\n" +
      "FULL QR DATA:\n" +
      qrData +
      "\n\n" +
      "EXTRACTED LRN:\n" +
      lrn
    );

    return;
  }

  // Stop camera
  try {
    scanner.stop();
  } catch (e) {}

  document.getElementById("status").innerText =
    "SUBMITTING...";

  // IMPORTANT:
  // FULL QR DATA first
  // LRN second
  sendScan(lrn, qrData);
}


/* =====================================================
   SEND SCAN TO APPS SCRIPT
   ===================================================== */

function sendScan(lrn, qrData) {

  const form = document.createElement("form");

  form.method = "POST";
  form.action = APPS_SCRIPT_URL;
  form.target = "hiddenFrame";

  // ==========================================
  // SEND ONLY LRN
  // ==========================================

  const lrnInput =
    document.createElement("input");

  lrnInput.type = "hidden";
  lrnInput.name = "lrn";

  // IMPORTANT:
  // Only the 12-digit LRN goes to Apps Script.
  lrnInput.value = lrn;


  // ==========================================
  // STATION
  // ==========================================

  const stationInput =
    document.createElement("input");

  stationInput.type = "hidden";
  stationInput.name = "station";
  stationInput.value = "MAIN";


  // ==========================================
  // LOG TYPE
  // ==========================================

  const logTypeInput =
    document.createElement("input");

  logTypeInput.type = "hidden";
  logTypeInput.name = "logType";
  logTypeInput.value = "SCAN";


  // ==========================================
  // ADD INPUTS
  // ==========================================

  form.appendChild(lrnInput);
  form.appendChild(stationInput);
  form.appendChild(logTypeInput);


  // ==========================================
  // SUBMIT
  // ==========================================

  document.body.appendChild(form);

  form.submit();

  form.remove();


  // ==========================================
  // DISPLAY
  // ==========================================

  showSuccess(
    qrData,
    lrn
  );
}


/* =====================================================
   SHOW SUCCESS
   ===================================================== */

function showSuccess(qrData, lrn) {

  document.getElementById(
    "scannerSection"
  ).style.display = "none";


  document.getElementById(
    "errorSection"
  ).classList.add("hidden");


  document.getElementById(
    "successSection"
  ).classList.remove("hidden");


  document.getElementById(
    "studentInfo"
  ).innerHTML =

    /*
     * FULL QR DATA
     */

    "<strong>FULL QR DATA:</strong>" +

    "<div class=\"qr-data\">" +

    escapeHtml(qrData) +

    "</div>" +


    "<br><br>" +


    /*
     * LRN
     */

    "<strong>LRN SENT TO LOG:</strong>" +

    "<div class=\"lrn-data\">" +

    escapeHtml(lrn) +

    "</div>" +


    "<br>" +

    "The LRN has been submitted to the logging system.";

}function showSuccess(qrData, lrn) {

  document.getElementById(
    "scannerSection"
  ).style.display = "none";


  document.getElementById(
    "errorSection"
  ).classList.add("hidden");


  document.getElementById(
    "successSection"
  ).classList.remove("hidden");


  document.getElementById(
    "studentInfo"
  ).innerHTML =

    /*
     * FULL QR DATA
     */

    "<strong>FULL QR DATA:</strong>" +

    "<div class=\"qr-data\">" +

    escapeHtml(qrData) +

    "</div>" +


    "<br><br>" +


    /*
     * LRN
     */

    "<strong>LRN SENT TO LOG:</strong>" +

    "<div class=\"lrn-data\">" +

    escapeHtml(lrn) +

    "</div>" +


    "<br>" +

    "The LRN has been submitted to the logging system.";

}


/* =====================================================
   SHOW ERROR
   ===================================================== */

function showError(
  message
) {


  /*
   * Stop scanning.
   */

  scanning = false;


  /*
   * Stop camera.
   */

  try {

    if (scanner) {

      scanner.stop();

    }

  } catch (e) {}


  /*
   * Hide scanner.
   */

  document.getElementById(
    "scannerSection"
  ).style.display =
    "none";


  /*
   * Hide success.
   */

  document.getElementById(
    "successSection"
  ).classList.add(
    "hidden"
  );


  /*
   * Show error.
   */

  document.getElementById(
    "errorSection"
  ).classList.remove(
    "hidden"
  );


  /*
   * Display error message.
   */

  document.getElementById(
    "errorMessage"
  ).innerText =
    message;

}


/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHtml(
  text
) {

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    text;


  return div.innerHTML;

}


/* =====================================================
   START SCANNER WHEN PAGE LOADS
   ===================================================== */

window.onload =
  function() {

    startScanner();

  };


</script>


<!-- ===================================================
     HIDDEN IFRAME
     =================================================== -->

<iframe
  name="hiddenFrame"
  style="display:none;">
</iframe>


</body>

</html>
