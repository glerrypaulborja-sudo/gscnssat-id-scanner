<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1">

  <title>GSCNSSAT ID Logging System</title>

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f3f4;
      color: #202124;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 30px;
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    .scanner-card {
      background: white;
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.12);
    }

    #reader {
      width: 100%;
      max-width: 650px;
      margin: auto;
    }

    .status {
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      margin: 20px 0;
    }

    .success {
      color: #188038;
    }

    .error {
      color: #d93025;
    }

    .info {
      text-align: center;
      font-size: 20px;
      line-height: 1.7;
      margin-top: 20px;
    }

    .qr-data {
      margin-top: 10px;
      padding: 15px;
      background: #f1f3f4;
      border-radius: 8px;
      word-break: break-word;
      text-align: left;
      font-size: 18px;
      line-height: 1.5;
    }

    .lrn-data {
      margin-top: 10px;
      padding: 15px;
      background: #e8f0fe;
      border-radius: 8px;
      font-size: 26px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .button {
      border: none;
      border-radius: 8px;
      padding: 14px 25px;
      font-size: 18px;
      cursor: pointer;
      margin-top: 20px;
      background: #1a73e8;
      color: white;
    }

    .center {
      text-align: center;
    }

    .hidden {
      display: none;
    }

  </style>

</head>


<body>

<div class="container">

  <h1>GSCNSSAT ID LOGGING SYSTEM</h1>

  <div class="subtitle">
    Learner QR Scanner
  </div>


  <div class="scanner-card">


    <!-- =================================================
         SCANNER SECTION
         ================================================= -->

    <div id="scannerSection">

      <div id="status" class="status">
        READY TO SCAN
      </div>

      <div id="reader"></div>

    </div>


    <!-- =================================================
         SUCCESS SECTION
         ================================================= -->

    <div id="successSection" class="hidden">

      <div class="status success">
        ✓ SCAN SUBMITTED
      </div>


      <div id="studentInfo" class="info">
      </div>


      <div class="center">

        <button
          class="button"
          onclick="startScanner()">

          SCAN NEXT LEARNER

        </button>

      </div>

    </div>


    <!-- =================================================
         ERROR SECTION
         ================================================= -->

    <div id="errorSection" class="hidden">

      <div class="status error">
        ✕ ERROR
      </div>


      <div id="errorMessage" class="info">
      </div>


      <div class="center">

        <button
          class="button"
          onclick="startScanner()">

          TRY AGAIN

        </button>

      </div>

    </div>


  </div>

</div>


<script>


/* =====================================================
   APPS SCRIPT WEB APP URL
   ===================================================== */

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbzfQo-pDnjCtEdQZDn4rVVURqT0h2-4GGzrjJd0uLHvnGLgDihRTe4L1QNsvN-dU9OT/exec";


/* =====================================================
   SCANNER VARIABLES
   ===================================================== */

let scanner = null;

let scanning = false;


/* =====================================================
   START SCANNER
   ===================================================== */

function startScanner() {

  /*
   * Show scanner
   */

  document.getElementById(
    "scannerSection"
  ).style.display = "block";


  /*
   * Hide success
   */

  document.getElementById(
    "successSection"
  ).classList.add("hidden");


  /*
   * Hide error
   */

  document.getElementById(
    "errorSection"
  ).classList.add("hidden");


  /*
   * Update status
   */

  document.getElementById(
    "status"
  ).innerText =
    "STARTING CAMERA...";


  /*
   * Clear previous scanner
   */

  if (scanner) {

    try {

      scanner.clear();

    } catch (e) {}

  }


  /*
   * Create new scanner
   */

  scanner =
    new Html5Qrcode("reader");


  /*
   * Get available cameras
   */

  Html5Qrcode.getCameras()

    .then(function(devices) {


      /*
       * No camera
       */

      if (
        !devices ||
        devices.length === 0
      ) {

        showError(
          "No camera was detected."
        );

        return;

      }


      /*
       * Use first camera
       */

      const cameraId =
        devices[0].id;


      /*
       * Start camera
       */

      scanner.start(

        cameraId,

        {
          fps: 10,

          qrbox: {
            width: 300,
            height: 300
          }
        },

        handleQRCode,

        function(error) {

          /*
           * Ignore normal
           * QR scanning errors.
           */

        }

      )

      .then(function() {

        scanning = true;

        document.getElementById(
          "status"
        ).innerText =
          "READY TO SCAN";

      })

      .catch(function(error) {

        console.error(error);

        showError(
          "Camera detected, but the browser could not start it."
        );

      });

    })

    .catch(function(error) {

      console.error(error);

      showError(
        "Unable to access the camera."
      );

    });

}


/* =====================================================
   QR CODE HANDLER
   ===================================================== */

function handleQRCode(decodedText) {

  /*
   * Prevent multiple scans.
   */

  if (!scanning) return;

  scanning = false;


  /*
   * IMPORTANT:
   *
   * Keep the COMPLETE QR DATA.
   */

  const qrData =
    String(decodedText).trim();


  /*
   * Debug information.
   */

  console.log(
    "================================"
  );

  console.log(
    "FULL QR DATA:"
  );

  console.log(qrData);


  /*
   * Extract ONLY the first
   * CSV field.
   *
   * Example:
   *
   * 131000000000,
   * HEZZEIL MAE A. BAGCAL,
   * May 31,
   * 2013.
   *
   * becomes:
   *
   * 131000000000
   */

  const lrn =
    qrData.split(",")[0].trim();


  console.log(
    "LRN TO SEND:"
  );

  console.log(lrn);

  console.log(
    "================================"
  );


  /*
   * Validate LRN.
   */

  if (!/^\d{12}$/.test(lrn)) {

    showError(

      "Invalid QR code.\n\n" +

      "FULL QR DATA:\n" +

      qrData +

      "\n\n" +

      "EXTRACTED LRN:\n" +

      lrn +

      "\n\n" +

      "Expected a 12-digit LRN."

    );

    return;

  }


  /*
   * Stop camera.
   */

  try {

    scanner.stop();

  } catch (e) {}


  /*
   * Update status.
   */

  document.getElementById(
    "status"
  ).innerText =
    "SUBMITTING...";


  /*
   * Send ONLY the LRN
   * to Apps Script.
   *
   * The complete QR data
   * is kept locally for display.
   */

  sendScan(
    lrn,
    qrData
  );

}


/* =====================================================
   SEND SCAN TO APPS SCRIPT
   ===================================================== */

function sendScan(
  lrn,
  qrData
) {


  /*
   * Create hidden form.
   *
   * This method avoids
   * browser CORS problems.
   */

  const form =
    document.createElement("form");


  /*
   * POST request.
   */

  form.method =
    "POST";


  form.action =
    APPS_SCRIPT_URL;


  /*
   * Send response to
   * hidden iframe.
   */

  form.target =
    "hiddenFrame";


  /* ===================================================
     LRN
     =================================================== */

  const lrnInput =
    document.createElement("input");


  lrnInput.type =
    "hidden";


  lrnInput.name =
    "lrn";


  /*
   * IMPORTANT:
   *
   * Only the LRN is sent.
   */

  lrnInput.value =
    lrn;


  /* ===================================================
     STATION
     =================================================== */

  const stationInput =
    document.createElement("input");


  stationInput.type =
    "hidden";


  stationInput.name =
    "station";


  stationInput.value =
    "MAIN";


  /* ===================================================
     LOG TYPE
     =================================================== */

  const logTypeInput =
    document.createElement("input");


  logTypeInput.type =
    "hidden";


  logTypeInput.name =
    "logType";


  logTypeInput.value =
    "SCAN";


  /* ===================================================
     ADD INPUTS
     =================================================== */

  form.appendChild(
    lrnInput
  );


  form.appendChild(
    stationInput
  );


  form.appendChild(
    logTypeInput
  );


  /* ===================================================
     SUBMIT FORM
     =================================================== */

  document.body.appendChild(
    form
  );


  form.submit();


  /*
   * Remove form after
   * submission.
   */

  form.remove();


  /*
   * Display complete QR
   * and extracted LRN.
   */

  showSuccess(
    qrData
  );

}


/* =====================================================
   SHOW SUCCESS
   ===================================================== */

function showSuccess(
  lrn,
  qrData
) {


  /*
   * Hide scanner.
   */

  document.getElementById(
    "scannerSection"
  ).style.display =
    "none";


  /*
   * Hide error.
   */

  document.getElementById(
    "errorSection"
  ).classList.add(
    "hidden"
  );


  /*
   * Show success.
   */

  document.getElementById(
    "successSection"
  ).classList.remove(
    "hidden"
  );


  /*
   * Display FULL QR DATA
   *
   * This is the complete
   * information decoded from
   * the QR code.
   */

  document.getElementById(
    "studentInfo"
  ).innerHTML =


    "<strong>FULL QR DATA:</strong>" +


    "<div class=\"qr-data\">" +

    escapeHtml(
      qrData
    ) +

    "</div>" +


    "<br>" +


    "<strong>LRN SENT TO LOG:</strong>" +


    "<div class=\"lrn-data\">" +

    escapeHtml(
      lrn
    ) +

    "</div>" +


    "<br>" +


    "The LRN has been submitted to the logging system.";

}


/* =====================================================
   SHOW ERROR
   ===================================================== */

function showError(
  message
) {


  /*
   * Stop scanning.
   */

  scanning = false;


  /*
   * Stop camera.
   */

  try {

    if (scanner) {

      scanner.stop();

    }

  } catch (e) {}


  /*
   * Hide scanner.
   */

  document.getElementById(
    "scannerSection"
  ).style.display =
    "none";


  /*
   * Hide success.
   */

  document.getElementById(
    "successSection"
  ).classList.add(
    "hidden"
  );


  /*
   * Show error.
   */

  document.getElementById(
    "errorSection"
  ).classList.remove(
    "hidden"
  );


  /*
   * Display error message.
   */

  document.getElementById(
    "errorMessage"
  ).innerText =
    message;

}


/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHtml(
  text
) {

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    text;


  return div.innerHTML;

}


/* =====================================================
   START SCANNER WHEN PAGE LOADS
   ===================================================== */

window.onload =
  function() {

    startScanner();

  };


</script>


<!-- ===================================================
     HIDDEN IFRAME
     =================================================== -->

<iframe
  name="hiddenFrame"
  style="display:none;">
</iframe>


</body>

</html>
