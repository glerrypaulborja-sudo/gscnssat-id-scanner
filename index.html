<head>

  <meta charset="UTF-8">

  <title>GSCNSSAT ID Logging System</title>

  <!-- QR SCANNER LIBRARY -->
  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>


  <style>

    /* =====================================================
       GENERAL
       ===================================================== */

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f3f4;
      color: #202124;
    }

    .container {
      width: 100%;

    /* =====================================================

    h1 {

      border-radius: 16px;

    #reader {

    /* =====================================================
       STATUS

    .status {

    }

    .success {
      color: #188038;

    /* =====================================================
       INFORMATION
       ===================================================== */

    .info {
      text-align: center;

    /* =====================================================

    .qr-label {

      display: block;
      width: 100%;

      /*
       * Allows very long QR data to wrap
       * instead of overflowing.
       */
      word-break: break-all;
      overflow-wrap: anywhere;

      text-align: left;
      font-size: 18px;
      line-height: 1.5;
    }

</head>


<body>


  <!-- ===================================================
       PAGE CONTAINER
       =================================================== -->

  <div class="container">


    <!-- =================================================
         HEADER
         ================================================= -->

    <h1>
      GSCNSSAT ID LOGGING SYSTEM
    </h1>

    <div class="subtitle">
      Learner QR Scanner
    </div>


    <!-- =================================================
         MAIN CARD
         ================================================= -->

    <div class="scanner-card">


      <!-- ===============================================
           SCANNER SECTION
           =============================================== -->

      <div id="scannerSection">

        <div
          id="status"
          class="status">

          READY TO SCAN

        </div>

        <div id="reader"></div>

      </div>


      <!-- ===============================================
           SUCCESS SECTION
           =============================================== -->

      <div
        id="successSection"
        class="hidden">

        <div class="status success">

          ✓ SCAN SUBMITTED

        </div>


        <div
          id="studentInfo"
          class="info">

        </div>


        <div class="center">

          <button
            type="button"
            class="button"
            onclick="startScanner()">

            SCAN NEXT LEARNER

          </button>

        </div>

      </div>


      <!-- ===============================================
           ERROR SECTION
           =============================================== -->

      <div
        id="errorSection"
        class="hidden">

        <div class="status error">

          ✕ ERROR

        </div>


        <div
          id="errorMessage"
          class="info">

        </div>


        <div class="center">

          <button
            type="button"
            class="button"
            onclick="startScanner()">

            TRY AGAIN

          </button>

        </div>

      </div>


    </div>

  </div>


  <!-- ===================================================
       HIDDEN IFRAME

       Apps Script POST response is loaded here so the
       main page does not navigate away.
       =================================================== -->

  <iframe
    name="hiddenFrame"
    style="display:none;">
  </iframe>


  <script>


    /* ===================================================
       APPS SCRIPT WEB APP URL
       =================================================== */

    const APPS_SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbzfQo-pDnjCtEdQZDn4rVVURqT0h2-4GGzrjD0uLHvnGLgDihRTe4L1QNsvN-dU9OT/exec";


    /* ===================================================
       SCANNER VARIABLES
       =================================================== */

    let scanner = null;

    let scanning = false;


    /* ===================================================
       START SCANNER
       =================================================== */

    async function startScanner() {

      /*
       * Prevent multiple scanners from running.
       */

      scanning = false;


      /*
       * Hide success and error sections.
       */

      document
        .getElementById("successSection")
        .classList.add("hidden");

      document
        .getElementById("errorSection")
        .classList.add("hidden");


      /*
       * Show scanner.
       */

      document
        .getElementById("scannerSection")
        .style.display = "block";


      /*
       * Update status.
       */

      document
        .getElementById("status")
        .innerText = "READY TO SCAN";


      /*
       * Stop previous scanner if one exists.
       */

      if (scanner) {

        try {

          await scanner.stop();

        } catch (e) {

          console.log(
            "Previous scanner already stopped."
          );

        }

        try {

          await scanner.clear();

        } catch (e) {

          console.log(
            "Scanner already cleared."
          );

        }

      }


      /*
       * Create new scanner.
       */

      scanner =
        new Html5Qrcode("reader");


      /*
       * Scanner configuration.
       */

      const config = {

        fps: 10,

        qrbox: {
          width: 300,
          height: 300
        },

        aspectRatio: 1.0

      };


      /*
       * Start camera.
       */

      try {

        await scanner.start(

          {
            facingMode: "user"
          },

          config,

          handleQRCode,

          handleScanError

        );

        scanning = true;

        document
          .getElementById("status")
          .innerText = "READY TO SCAN";

      }

      catch (error) {

        console.error(
          "Camera error:",
          error
        );

        showError(
          "Unable to start the camera.\n\n" +
          "Please make sure:\n" +
          "• Camera permission is allowed.\n" +
          "• The webcam is connected.\n" +
          "• No other application is using the camera."
        );

      }

    }


    /* ===================================================
       QR SCAN ERROR CALLBACK

       This runs continuously while the scanner is looking
       for a QR code.

       We intentionally do not display these errors because
       they happen normally while searching for a QR code.
       =================================================== */

    function handleScanError(errorMessage) {

      /*
       * Do nothing.

       html5-qrcode generates frequent scan errors when
       there is no QR code visible.
       */

    }


    /* ===================================================
       QR CODE FOUND
       =================================================== */

    async function handleQRCode(decodedText) {


      /*
       * Prevent duplicate scans.
       */

      if (!scanning) {
        return;
      }


      /*
       * Immediately disable further scans.
       */

      scanning = false;


      /*
       * Convert QR result to string.
       */

      const qrData =
        String(decodedText).trim();


      console.log(
        "FULL QR DATA:",
        qrData
      );


      /*
       * Extract first field.

       Example QR:

       123456789012,JUAN DELA CRUZ,01/01/2010

       Result:

       123456789012
       */

      const lrn =
        qrData
          .split(",")[0]
          .trim();


      console.log(
        "LRN TO SEND:",
        lrn
      );


      /* =================================================
         VALIDATE LRN
         ================================================= */

      if (!/^\d{12}$/.test(lrn)) {

        showError(

          "Invalid QR code.\n\n" +

          "FULL QR DATA:\n" +
          qrData +

          "\n\n" +

          "EXTRACTED LRN:\n" +
          lrn

        );

        return;

      }


      /* =================================================
         STOP CAMERA
         ================================================= */

      try {

        await scanner.stop();

      }

      catch (error) {

        console.log(
          "Scanner stop:",
          error
        );

      }


      /* =================================================
         UPDATE STATUS
         ================================================= */

      document
        .getElementById("status")
        .innerText = "SUBMITTING...";


      /* =================================================
         SEND DATA
         ================================================= */

      sendScan(
        lrn,
        qrData
      );

    }


    /* ===================================================
       SEND SCAN TO APPS SCRIPT
       =================================================== */

    function sendScan(
      lrn,
      qrData
    ) {


      /*
       * Create POST form.
       */

      const form =
        document.createElement("form");


      form.method = "POST";

      form.action =
        APPS_SCRIPT_URL;

      form.target =
        "hiddenFrame";


      /* =================================================
         LRN
         ================================================= */

      const lrnInput =
        document.createElement("input");

      lrnInput.type = "hidden";

      lrnInput.name = "lrn";

      lrnInput.value = lrn;


      /* =================================================
         STATION
         ================================================= */

      const stationInput =
        document.createElement("input");

      stationInput.type = "hidden";

      stationInput.name = "station";

      stationInput.value = "MAIN";


      /* =================================================
         LOG TYPE
         ================================================= */

      const logTypeInput =
        document.createElement("input");

      logTypeInput.type = "hidden";

      logTypeInput.name = "logType";

      logTypeInput.value = "SCAN";


      /* =================================================
         ADD INPUTS
         ================================================= */

      form.appendChild(
        lrnInput
      );

      form.appendChild(
        stationInput
      );

      form.appendChild(
        logTypeInput
      );


      /* =================================================
         SUBMIT FORM
         ================================================= */

      document.body.appendChild(
        form
      );

      form.submit();

      form.remove();


      /* =================================================
         DISPLAY SUCCESS

         The display uses qrData, not lrn.

         This means the complete QR content will appear.
         ================================================= */

      showSuccess(
        qrData,
        lrn
      );

    }


    /* ===================================================
       SHOW SUCCESS
       =================================================== */

    function showSuccess(
      qrData,
      lrn
    ) {


      /*
       * Hide scanner.
       */

      document
        .getElementById("scannerSection")
        .style.display = "none";


      /*
       * Hide error.
       */

      document
        .getElementById("errorSection")
        .classList.add("hidden");


      /*
       * Show success.
       */

      document
        .getElementById("successSection")
        .classList.remove("hidden");


      /*
       * Build success information.

       * IMPORTANT:
       * FULL QR DATA and the actual data are placed
       * inside separate block elements.
       */

      document
        .getElementById("studentInfo")
        .innerHTML =

          "<div>" +

            "<strong class=\"qr-label\">" +
              "FULL QR DATA:" +
            "</strong>" +

            "<div class=\"qr-data\">" +
              escapeHtml(qrData) +
            "</div>" +

          "</div>" +


          "<div style=\"margin-top:25px;\">" +

            "<strong class=\"lrn-label\">" +
              "LRN SENT TO LOG:" +
            "</strong>" +

            "<div class=\"lrn-data\">" +
              escapeHtml(lrn) +
            "</div>" +

          "</div>" +


          "<div style=\"margin-top:20px;\">" +

            "The LRN has been submitted to the logging system." +

          "</div>";

    }


    /* ===================================================
       SHOW ERROR
       =================================================== */

    async function showError(
      message
    ) {


      /*
       * Stop scanning.
       */

      scanning = false;


      /*
       * Stop camera.
       */

      if (scanner) {

        try {

          await scanner.stop();

        }

        catch (e) {

          console.log(
            "Scanner stop:",
            e
          );

        }

      }


      /*
       * Hide scanner.
       */

      document
        .getElementById("scannerSection")
        .style.display = "none";


      /*
       * Hide success.
       */

      document
        .getElementById("successSection")
        .classList.add("hidden");


      /*
       * Show error.
       */

      document
        .getElementById("errorSection")
        .classList.remove("hidden");


      /*
       * Display error.
       */

      document
        .getElementById("errorMessage")
        .innerText = message;

    }


    /* ===================================================
       ESCAPE HTML
       =================================================== */

    function escapeHtml(
      text
    ) {

      const div =
        document.createElement("div");


      div.textContent =
        String(text);


      return div.innerHTML;

    }


    /* ===================================================
       START WHEN PAGE LOADS
       =================================================== */

    window.addEventListener(
      "load",
      function() {

        startScanner();

      }
    );


  </script>


</body>

</html>
