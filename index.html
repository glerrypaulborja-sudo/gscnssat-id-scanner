<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1">

  <title>GSCNSSAT ID Logging System</title>

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f3f4;
      color: #202124;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 30px;
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    .scanner-card {
      background: white;
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.12);
    }

    #reader {
      width: 100%;
      max-width: 650px;
      margin: auto;
    }

    .status {
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      margin: 20px 0;
    }

    .success {
      color: #188038;
    }

    .error {
      color: #d93025;
    }

    .info {
      text-align: center;
      font-size: 20px;
      line-height: 1.7;
      margin-top: 20px;
    }

    .button {
      border: none;
      border-radius: 8px;
      padding: 14px 25px;
      font-size: 18px;
      cursor: pointer;
      margin-top: 20px;
      background: #1a73e8;
      color: white;
    }

    .center {
      text-align: center;
    }

    .hidden {
      display: none;
    }

  </style>

</head>


<body>

<div class="container">

  <h1>GSCNSSAT ID LOGGING SYSTEM</h1>

  <div class="subtitle">
    Learner QR Scanner
  </div>


  <div class="scanner-card">

    <!-- SCANNER -->

    <div id="scannerSection">

      <div id="status" class="status">
        READY TO SCAN
      </div>

      <div id="reader"></div>

    </div>


    <!-- SUCCESS -->

    <div id="successSection" class="hidden">

      <div class="status success">
        ✓ SCAN LOGGED
      </div>

      <div id="studentInfo" class="info">
      </div>

      <div class="center">

        <button
          class="button"
          onclick="startScanner()">

          SCAN NEXT LEARNER

        </button>

      </div>

    </div>


    <!-- ERROR -->

    <div id="errorSection" class="hidden">

      <div class="status error">
        ✕ ERROR
      </div>

      <div id="errorMessage" class="info">
      </div>

      <div class="center">

        <button
          class="button"
          onclick="startScanner()">

          TRY AGAIN

        </button>

      </div>

    </div>

  </div>

</div>


<script>


/* =====================================================
   APPS SCRIPT URL
   ===================================================== */

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbzfQo-pDnjCtEdQZDn4rVVURqT0h2-4GGzrjJd0uLHvnGLgDihRTe4L1QNsvN-dU9OT/exec";


/* =====================================================
   SCANNER VARIABLES
   ===================================================== */

let scanner = null;

let scanning = false;


/* =====================================================
   START SCANNER
   ===================================================== */

function startScanner() {

  document.getElementById(
    "scannerSection"
  ).style.display = "block";


  document.getElementById(
    "successSection"
  ).classList.add("hidden");


  document.getElementById(
    "errorSection"
  ).classList.add("hidden");


  document.getElementById(
    "status"
  ).innerText = "STARTING CAMERA...";


  if (scanner) {

    try {

      scanner.clear();

    } catch (e) {}

  }


  scanner =
    new Html5Qrcode("reader");


  Html5Qrcode.getCameras()

    .then(function(devices) {

      if (
        !devices ||
        devices.length === 0
      ) {

        showError(
          "No camera was detected."
        );

        return;

      }


      /*
       * Use the first available camera.
       */

      const cameraId =
        devices[0].id;


      scanner.start(

        cameraId,

        {
          fps: 10,

          qrbox: {
            width: 300,
            height: 300
          }
        },

        handleQRCode,

        function(error) {
          // Ignore normal scanning failures
        }

      )

      .then(function() {

        scanning = true;

        document.getElementById(
          "status"
        ).innerText =
          "READY TO SCAN";

      })

      .catch(function(error) {

        console.error(error);

        showError(
          "Camera detected, but the browser could not start it."
        );

      });

    })

    .catch(function(error) {

      console.error(error);

      showError(
        "Unable to access the camera."
      );

    });

}


/* =====================================================
   QR CODE HANDLER
   ===================================================== */

function handleQRCode(decodedText) {

  if (!scanning) {

    return;

  }


  scanning = false;


  /*
   * The QR contains:
   *
   * 131000000000,
   * HEZZEIL MAE A. BAGCAL,
   * May 31,
   * 2013.
   *
   * We only need the FIRST field.
   */


  const qrData =
    String(decodedText).trim();


  console.log(
    "FULL QR:",
    qrData
  );


  /*
   * Split CSV.
   */

  const fields =
    qrData.split(",");


  /*
   * First field = LRN
   */

  const lrn =
    String(
      fields[0] || ""
    ).trim();


  console.log(
    "EXTRACTED LRN:",
    lrn
  );


  /*
   * Validate LRN.
   */

  if (
    !/^\d{12}$/.test(lrn)
  ) {

    showError(
      "Invalid QR code.\n\n" +
      "Extracted value:\n" +
      lrn +
      "\n\n" +
      "Expected a 12-digit LRN."
    );

    return;

  }


  /*
   * Stop camera.
   */

  try {

    scanner.stop();

  } catch (e) {}


  document.getElementById(
    "status"
  ).innerText =
    "LOGGING...";


  /*
   * Send LRN to Apps Script.
   */

  sendScan(lrn);

}


/* =====================================================
   SEND SCAN
   ===================================================== */

function sendScan(lrn) {

  /*
   * Create hidden form.
   *
   * This avoids CORS problems.
   */

  const form =
    document.createElement("form");


  form.method = "POST";


  form.action =
    APPS_SCRIPT_URL;


  form.target =
    "hiddenFrame";


  /*
   * LRN
   */

  const lrnInput =
    document.createElement("input");


  lrnInput.type =
    "hidden";


  lrnInput.name =
    "lrn";


  lrnInput.value =
    lrn;


  /*
   * Station
   */

  const stationInput =
    document.createElement("input");


  stationInput.type =
    "hidden";


  stationInput.name =
    "station";


  stationInput.value =
    "MAIN";


  /*
   * Log type
   */

  const logTypeInput =
    document.createElement("input");


  logTypeInput.type =
    "hidden";


  logTypeInput.name =
    "logType";


  logTypeInput.value =
    "SCAN";


  /*
   * Add inputs.
   */

  form.appendChild(
    lrnInput
  );


  form.appendChild(
    stationInput
  );


  form.appendChild(
    logTypeInput
  );


  /*
   * Add form to page.
   */

  document.body.appendChild(
    form
  );


  /*
   * Submit.
   */

  form.submit();


  /*
   * Remove form.
   */

  form.remove();


  /*
   * Show result.
   *
   * We will improve this later
   * to wait for Apps Script's
   * actual response.
   */

  showSuccess(lrn);

}


/* =====================================================
   SHOW SUCCESS
   ===================================================== */

function showSuccess(lrn) {

  document.getElementById(
    "scannerSection"
  ).style.display = "none";


  document.getElementById(
    "errorSection"
  ).classList.add("hidden");


  document.getElementById(
    "successSection"
  ).classList.remove("hidden");


  document.getElementById(
    "studentInfo"
  ).innerHTML =

    "<strong>LRN:</strong> " +
    escapeHtml(lrn) +

    "<br><br>" +

    "The scan has been sent to the logging system.";

}


/* =====================================================
   SHOW ERROR
   ===================================================== */

function showError(message) {

  scanning = false;


  try {

    if (scanner) {

      scanner.stop();

    }

  } catch (e) {}


  document.getElementById(
    "scannerSection"
  ).style.display = "none";


  document.getElementById(
    "successSection"
  ).classList.add("hidden");


  document.getElementById(
    "errorSection"
  ).classList.remove("hidden");


  document.getElementById(
    "errorMessage"
  ).innerText =
    message;

}


/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHtml(text) {

  const div =
    document.createElement("div");


  div.textContent =
    text;


  return div.innerHTML;

}


/* =====================================================
   START WHEN PAGE LOADS
   ===================================================== */

window.onload =
  function() {

    startScanner();

  };


</script>


<!--
  Hidden target used by the
  Apps Script POST request.
-->

<iframe
  name="hiddenFrame"
  style="display:none;">
</iframe>


</body>

</html>
